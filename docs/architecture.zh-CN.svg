<text x="40" y="72" font-size="12" fill="#656D76" dominant-baseline="central">入口是一个 AccessibilityService，没有主界面。</text>

<text x="40" y="98" font-size="12" fill="#656D76" dominant-baseline="central">入口有五个，而且没有主界面</text>
