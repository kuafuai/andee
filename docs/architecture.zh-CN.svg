<rect x="40" y="182" width="600" height="76" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="52" y="206" font-size="13" fill="#0C447C" font-weight="600" dominant-baseline="central">ScreenBodyService — AccessibilityService</text>
<text x="52" y="228" font-size="12" fill="#185FA5" dominant-baseline="central">唯一的协调者。它建起整个对象图，悬浮球是它唯一的脸；</text>
<text x="52" y="250" font-size="12" fill="#185FA5" dominant-baseline="central">所有出口都落在这里 —— 一轮先写进 ChatHistory，再交给当时生效的后端。</text>
<path d="M340 258 V276" fill="none" stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="276" width="600" height="132" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="52" y="296" font-size="12" fill="#656D76" dominant-baseline="central">谁在回答 —— 三种后端，互斥</text>
<rect x="56" y="306" width="180" height="76" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="68" y="328" font-size="13" fill="#0C447C" font-weight="600" dominant-baseline="central">LocalBrain · 默认</text>
<text x="68" y="348" font-size="12" fill="#185FA5" dominant-baseline="central">本机 · 自备 key</text>
<text x="68" y="368" font-size="12" fill="#185FA5" dominant-baseline="central">LlmClient → DeepSeek</text>
<rect x="250" y="306" width="180" height="76" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
<text x="262" y="328" font-size="13" fill="#633806" font-weight="600" dominant-baseline="central">API market</text>
<text x="262" y="348" font-size="12" fill="#854F0B" dominant-baseline="central">CodeFlying · 托管</text>
<text x="262" y="368" font-size="12" fill="#854F0B" dominant-baseline="central">LLM/ASR/TTS + 工具</text>
<rect x="444" y="306" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/>
<text x="456" y="328" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">Hub brain</text>
<text x="456" y="348" font-size="12" fill="#656D76" dominant-baseline="central">远端 · 经 WS</text>
<text x="456" y="368" font-size="12" fill="#656D76" dominant-baseline="central">hub_url 为空时关掉</text>
<text x="52" y="396" font-size="12" fill="#656D76" dominant-baseline="central">只有前两个在本机跑循环；hub 的循环在对面，靠一条 socket 到达。</text>
<path d="M340 408 V426" fill="none" stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="426" width="600" height="324" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="52" y="450" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">Harness —— LocalBrain。这就是 agent loop，它跑在这台平板上。</text>
<text x="52" y="472" font-size="12" fill="#656D76" dominant-baseline="central">1 · 系统提示词 = LocalPrompt.withPersona(persona, scene)，保持不变</text>
<text x="52" y="492" font-size="12" fill="#656D76" dominant-baseline="central">2 · 会变的东西改走 user 消息：时钟、notebook 索引、情景、照片</text>
<text x="52" y="512" font-size="12" fill="#656D76" dominant-baseline="central">3 · 工具表每轮重建：ToolSchemas.all() + 通话扩展 + 市场</text>
<rect x="56" y="530" width="568" height="176" rx="8" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/>
<text x="68" y="552" font-size="12" fill="#1F2328" font-weight="600" dominant-baseline="central">for step in 1..maxSteps —— 默认 25，可调，钳在 1..200</text>
<rect x="72" y="566" width="536" height="42" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="84" y="587" font-size="12" fill="#185FA5" dominant-baseline="central">LlmClient.complete(history, tools) · 非流式 · 读超时 180 秒</text>
<path d="M340 608 V620 M202 620 H478" fill="none" stroke="#8C959F" stroke-width="1.5"/>
<path d="M202 620 V628" fill="none" stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)"/>
