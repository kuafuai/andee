<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1340" width="100%" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
<title>Andee — 架构图</title>
<desc>Andee 没有主界面：唯一的入口是一个 AccessibilityService，也就是 ScreenBodyService，它是唯一的协调者。能开局一轮的有五个入口——离线唤醒词、语音或打字、通知监听、定时与待办、以及从 WebSocket 服务进来的外部请求。一轮先写进 ChatHistory，然后交给三种互斥后端之一：本机 LocalBrain（自备 key，开箱默认）、CodeFlying 托管的 API market（构建进去了才启用，一个域名代理 LLM/ASR/TTS 并额外提供市场工具），以及经 socket 到达的 hub 大脑。只有前两个在本机跑 agent loop。这个 loop 就是 LocalBrain：用 LocalPrompt.withPersona 组装系统提示词，把会变的部分（时钟、notebook 索引、情景、照片）放进 user 消息，每轮重建工具表，然后在一个非流式的 for 循环里调 LlmClient.complete，最多 maxSteps 步、默认 25。带工具调用的回复经 methodOf() 送到 CommandDispatcher；不带工具调用的回复就结束这一轮。守卫：代际号取消过期轮、连续三次相同调用即停、历史裁剪并由 harvest 压缩。随后由 ScreenBodyService 和 dispatcher 把结果从六个通道送出去——语音走 TtsController，文字是气泡、字幕和卡片，网页是 HtmlActivity 里的全屏 HTML，产物存在 ChatHistory 里、说一句就能改，长文双击用 TextPage 全屏读，物理动作走 DogMotion 经 USB 串口。当改由 hub 回答时，它的循环不在本机，而是经那条 socket 到达身体。三条不变量：拒绝写在 dispatcher 里而不是提示词里；通知文本是数据，通知触发的回合碰不到保险箱也不能进或建情景；模型永远不算坐标。</desc>
