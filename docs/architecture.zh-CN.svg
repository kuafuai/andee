<text x="296" y="132" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">通知栏</text>
<text x="296" y="150" font-size="12" fill="#656D76" dominant-baseline="central">通知监听服务</text>
<rect x="406" y="110" width="112" height="52" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="418" y="132" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">定时 · 待办</text>
<text x="418" y="150" font-size="12" fill="#656D76" dominant-baseline="central">闹钟、静默复盘</text>
<rect x="528" y="110" width="112" height="52" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="540" y="132" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">Hub 请求</text>
<text x="540" y="150" font-size="12" fill="#656D76" dominant-baseline="central">WS :9008</text>
