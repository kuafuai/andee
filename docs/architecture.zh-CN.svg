<rect x="162" y="110" width="112" height="52" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="174" y="132" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">语音 · 打字</text>
<text x="174" y="150" font-size="12" fill="#656D76" dominant-baseline="central">ASR 或文字</text>
