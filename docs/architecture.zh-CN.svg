<text x="84" y="650" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">有 tool_calls</text>
<text x="84" y="670" font-size="12" fill="#656D76" dominant-baseline="central">runTool → methodOf() → dispatcher</text>
<rect x="348" y="628" width="260" height="52" rx="8" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/>
<text x="360" y="650" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">没有 tool_calls</text>
<text x="360" y="670" font-size="12" fill="#656D76" dominant-baseline="central">onFinal(content) —— 本轮结束</text>
