<text x="52" y="876" font-size="13" fill="#0C447C" font-weight="600" dominant-baseline="central">CommandDispatcher —— 唯一出口</text>
<text x="52" y="898" font-size="12" fill="#185FA5" dominant-baseline="central">when(method) 挑真正干活的控制器：device.* · screen.* · note.* · scene.*</text>
<text x="52" y="918" font-size="12" fill="#185FA5" dominant-baseline="central">meeting.* · dog.* · tts.* · ui.* —— 没匹配的转给市场，再转通话扩展</text>
<text x="52" y="936" font-size="12" fill="#185FA5" dominant-baseline="central">拒绝写在这里，不在提示词里。</text>
<path d="M340 946 V968" fill="none" stroke="#8C959F" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="968" width="600" height="250" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="52" y="990" font-size="12" fill="#656D76" dominant-baseline="central">从哪儿出来 —— 六个通道</text>
<rect x="56" y="1002" width="180" height="76" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="68" y="1024" font-size="13" fill="#0C447C" font-weight="600" dominant-baseline="central">语音</text>
<text x="68" y="1044" font-size="12" fill="#185FA5" dominant-baseline="central">TtsController → 扬声器</text>
<text x="68" y="1064" font-size="12" fill="#185FA5" dominant-baseline="central">整段读，一次给完</text>
<rect x="250" y="1002" width="180" height="76" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="262" y="1024" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">文字</text>
<text x="262" y="1044" font-size="12" fill="#656D76" dominant-baseline="central">气泡、字幕、卡片</text>
<text x="262" y="1064" font-size="12" fill="#656D76" dominant-baseline="central">ChatHistory · CardUi</text>
<rect x="444" y="1002" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/>
<text x="456" y="1024" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">网页</text>
<text x="456" y="1044" font-size="12" fill="#656D76" dominant-baseline="central">HtmlActivity 全屏</text>
<text x="456" y="1064" font-size="12" fill="#656D76" dominant-baseline="central">一次只留一页</text>
<rect x="56" y="1088" width="180" height="76" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="68" y="1110" font-size="13" fill="#0C447C" font-weight="600" dominant-baseline="central">产物</text>
<text x="68" y="1130" font-size="12" fill="#185FA5" dominant-baseline="central">ChatHistory Role.PAGE</text>
<text x="68" y="1150" font-size="12" fill="#185FA5" dominant-baseline="central">可回看，说一句就能改</text>
<rect x="250" y="1088" width="180" height="76" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<text x="262" y="1110" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">长文</text>
<text x="262" y="1130" font-size="12" fill="#656D76" dominant-baseline="central">TextPage</text>
<text x="262" y="1150" font-size="12" fill="#656D76" dominant-baseline="central">双击消息全屏读</text>
<rect x="444" y="1088" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#AFB8C1" stroke-width="1"/>
<text x="456" y="1110" font-size="13" fill="#1F2328" font-weight="600" dominant-baseline="central">身体</text>
<text x="456" y="1130" font-size="12" fill="#656D76" dominant-baseline="central">DogMotion → USB 串口</text>
<text x="456" y="1150" font-size="12" fill="#656D76" dominant-baseline="central">发完即返回</text>
<text x="52" y="1186" font-size="12" fill="#656D76" dominant-baseline="central">语音和文字在轮次结束时由服务发出；网页、卡片和动作在轮次中由 dispatcher 指挥。</text>
<text x="52" y="1204" font-size="12" fill="#656D76" dominant-baseline="central">眼睛也是通道：LookActivity 和 ScanActivity 占屏取帧，画面作为 vision 消息回到循环。</text>

<rect x="40" y="1240" width="600" height="90" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
<text x="52" y="1262" font-size="13" fill="#633806" font-weight="600" dominant-baseline="central">三条不变量</text>
<text x="52" y="1284" font-size="12" fill="#854F0B" dominant-baseline="central">拒绝写在 dispatcher 里，不在提示词里 —— 提示词说不动它</text>
<text x="52" y="1304" font-size="12" fill="#854F0B" dominant-baseline="central">通知文本是数据；通知触发的回合碰不到保险箱、也不能进或建情景</text>
<text x="52" y="1324" font-size="12" fill="#854F0B" dominant-baseline="central">模型永远不算坐标：0-1000 相对坐标由设备换算，越界直接报错不夹紧</text>
</svg>
