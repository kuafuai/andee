plugins {
    alias(libs.plugins.androidApplication)
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

android {
    namespace 'net.kuafuai.andee'
    compileSdk 34

    defaultConfig {
        applicationId "net.kuafuai.andee"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // The robot dog's dongle is a plain USB-serial device (Arduino Nano:
    // CH340/CH9102/FTDI depending on the clone). 3.8.1 deliberately, not the
    // latest: 3.11.0 pulls kotlin-stdlib 2.2.x, whose metadata this project's
    // Kotlin 1.9.22 compiler cannot read. 3.8.1 is pure Java.
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'

    // Camera eye: CameraX preview/analysis + ML Kit barcode.
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}