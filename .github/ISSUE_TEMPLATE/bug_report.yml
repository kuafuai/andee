name: Bug report
description: Something is not working — a crash, a wrong result, or a feature that silently does nothing.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Before you start:** the single most common cause of an unfixable report here is a missing
        device profile. This project talks to the Android system at a level where ROMs disagree —
        a call that works on AOSP can fail silently on MagicOS. Without the fields below we usually
        cannot reproduce, and the issue gets closed.

        Security problem? **Do not use this template.** See [SECURITY.md](https://github.com/kuafuai/andee/blob/main/SECURITY.md).

  - type: checkboxes
    id: self-checks
    attributes:
      label: Self checks
      description: These keep the tracker usable. All are required.
      options:
        - label: I have read the [Contributing Guide](https://github.com/kuafuai/andee/blob/main/CONTRIBUTING.md) ([中文](https://github.com/kuafuai/andee/blob/main/CONTRIBUTING.zh-CN.md)).
          required: true
        - label: I have searched existing issues, including closed ones.
          required: true
        - label: This is a bug report, not a question. Questions belong in Discussions.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md, privately).
          required: true

  - type: input
    id: build
    attributes:
      label: Build
      description: |
        How you got this build. Version numbers are useless on their own — `versionCode`/`versionName`
        have been `1`/`1.0` throughout, so a version number does not identify a build.
      placeholder: "commit hash, release tag, or \"built from main myself on <date>\""
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device, Android version, ROM
      description: "Output of `adb shell getprop ro.product.model`, `ro.build.version.release`, and the ROM name. Include `adb shell wm size` and `wm density`."
      placeholder: "HONOR AMM-AN00 / Android 15 / MagicOS 9 — 1200x2664 @520"
    validations:
      required: true

  - type: dropdown
    id: brain-mode
    attributes:
      label: Brain mode
      description: Which brain was answering?
      options:
        - hub (a separate brain host, over WebSocket)
        - local (on-device, calling an OpenAI-compatible API)
        - not sure
    validations:
      required: true

  - type: checkboxes
    id: setup-state
    attributes:
      label: What was switched on
      options:
        - label: Accessibility service was enabled
        - label: Overlay permission was granted
        - label: Notification access was granted
        - label: The app had been granted `WRITE_SECURE_SETTINGS` via adb

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us the exact sequence. If the agent was involved, say what you asked it to do and what tool calls it made.
      placeholder: |
        1. Ask the agent to ...
        2. It calls ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: Do not paste the steps again — say what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      placeholder: Include exact on-screen text. If it failed silently, say so — "nothing happened" is a valid and useful observation.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: logcat
      description: "At minimum: `adb logcat -s Body:* Screen:* Wake:* Dog:* GroundingLog:*`. Paste inside fenced code blocks."
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, screen recordings, a dump of the UI tree, or what you already ruled out.
    validations:
      required: false
