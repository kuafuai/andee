# Requires a `Signed-off-by:` line on every commit a pull request adds.
#
# Why the DCO and not a CLA service: a CLA needs a hosted bot and an account on
# it, and it would have to be installed before this repository is even public.
# The DCO is the same evidence — a statement, attached to each commit, that the
# contributor has the right to submit the code — carried inside the commit
# itself, where it survives a fork, a mirror, and a move to another host.
#
# It does not replace LICENSE A.2. The DCO records that a contributor *may*
# submit this work; A.2 is what they *grant* by doing so. Both are wanted and
# neither substitutes for the other — a sign-off with no licence to grant is
# as useless as a licence grant from someone who had no right to make it.
#
# Merges are skipped. A merge commit has no content of its own, and demanding a
# sign-off on one would fail every pull request that merged main into itself.
name: dco

on:
  pull_request:

jobs:
  signed-off-by:
    runs-on: ubuntu-latest
    steps:
      # Full history: the range below cannot be resolved from a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by line
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <[^@]+@[^>]+>'; then
              subject=$(git log -1 --format='%h %s' "$sha")
              echo "::error::$subject has no Signed-off-by line"
              missing=1
            fi
          done < <(git rev-list --no-merges "$base..$head")

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Add it with one of:"
            echo "  git commit --amend -s              # the last commit only"
            echo "  git rebase --signoff $base         # every commit on this branch"
            exit 1
          fi
