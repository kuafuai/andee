pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
        // The dog's USB serial driver (usb-serial-for-android) is JitPack-only.
        // Aliyun proxies jitpack but answers 401 without an account, so this one
        // goes direct — keep it last, after the mirrors.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "body"
include ':app'
