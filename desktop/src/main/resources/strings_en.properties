s_settings_notify_note=When a message arrives it decides for itself whether it is worth your attention: lets the noise go, says the useful part out loud, handles what needs handling. "Chat apps" means the ones with a person on the other end — WeChat, QQ, DingTalk, Lark, SMS. "Everything" watches the rest too, minus progress bars and permanent notifications. It only puts a card up when it cannot decide. Off means nothing interrupts you — the messages are all still there, and you can ask about them whenever.
