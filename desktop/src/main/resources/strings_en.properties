s_settings_nudge_note=Now and then a small bubble appears beside the ball — "Time for some water", "Want me to order lunch?". It makes no sound and fades by itself if you ignore it, and it never shows while you are busy, while it is talking or while you are away from the Mac. With the chat window in front it becomes a line in the chat instead. "Rarely" is at most 1 an hour and 4 a day, "Normal" 2 an hour and 8 a day. Long-press a bubble and that kind never comes back.
