s_settings_section_drive=On its own
s_settings_drive_note=It keeps a few things it cares about, each with how often it means to look. It checks about every 20 minutes whether one has waited too long and is worth doing now. If so, it works on it for a while — writing a plan, tidying the people it knows, noting a thought, at most one bubble — without touching the screen, speaking, or sending anything for you. It does not ask whether you are there, and does not keep to hours: at most 40 checks and 6 work turns a day, with at least an hour between work turns; a tap on the ball stops it. Nothing overdue costs nothing. Off means it only moves when you call it.
